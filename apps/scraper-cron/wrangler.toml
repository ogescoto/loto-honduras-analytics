# Cloudflare Worker programado — ingestión periódica de sorteos.
name = "loto-scraper-cron"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Dispara el scraping cada día a las 22:00 UTC (tras los sorteos nocturnos).
[triggers]
crons = ["0 22 * * *"]

# Variables NO secretas.
[vars]
LOTERIA_SOURCE_URL = "https://www.example-loto-honduras.hn"

# Secretos requeridos (wrangler secret put <NAME>):
#   NEON_DATABASE_URL
#   DECODO_PROXY_HOST
#   DECODO_PROXY_PORT
#   DECODO_PROXY_USERNAME
#   DECODO_PROXY_PASSWORD
